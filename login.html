<script>
var passwordM = document.getElementById("password-manager");
var iconMs = document.getElementById("mshow");
var iconMus = document.getElementById("munshow");
var passwordR = document.getElementById("password-resident");
var iconRs = document.getElementById("rshow");
var iconRus = document.getElementById("runshow");
var btnManager = document.getElementById("btn-manager");
var btnResident = document.getElementById("btn-resident");
var managerForm = document.getElementById("manager-form");
var residentForm = document.getElementById("resident-form");

function main(){
    // Show and Unshow password for Manager
    iconMus.addEventListener("click",()=>{
        iconMus.classList.add("d-none");
        iconMs.classList.remove("d-none");
        passwordM.type="text";
    });
    iconMs.addEventListener("click",()=>{
        iconMus.classList.remove("d-none");
        iconMs.classList.add("d-none");
        passwordM.type="password";
    });
    // Show and Unshow password for Resident
    iconRus.addEventListener("click",()=>{
        iconRus.classList.add("d-none");
        iconRs.classList.remove("d-none");
        passwordR.type="text";

    });
    iconRs.addEventListener("click",()=>{
        iconRus.classList.remove("d-none");
        iconRs.classList.add("d-none");
        passwordR.type="password";

    });
    // Switch to Manager
    btnManager.addEventListener("click",()=>{
            managerForm.classList.add("active");
            residentForm.classList.remove("active");
        
    });
    // Switch to Resident
    btnResident.addEventListener("click",()=>{

            residentForm.classList.add("active");
            managerForm.classList.remove("active");

    });
    
}

document.addEventListener("DOMContentLoaded",main);
</script>
